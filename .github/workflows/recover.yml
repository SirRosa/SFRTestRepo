name: Recover Balrond Fur Randomizer

on:
  push:
    paths:
      - ".github/workflows/recover.yml"
      - "scripts/recover_assets.py"
      - "scripts/build_material_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install ILSpy command line
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download the original public Thunderstore 1.0.7 package
        shell: bash
        run: |
          mkdir -p _input recovered/source recovered/assets
          curl -fL --retry 3 --retry-all-errors \
            -o /tmp/Balrond-furRandomizer-1.0.7.zip \
            "https://gcdn.thunderstore.io/live/repository/packages/Balrond-balrond_furRandomizer-1.0.7.zip"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = "/tmp/Balrond-furRandomizer-1.0.7.zip"
          target = pathlib.Path("_input/BalrondFurRandomizer.dll")
          with zipfile.ZipFile(archive) as z:
              selected = [p for p in z.namelist() if p.lower().endswith("balrondfurrandomizer.dll")]
              assert len(selected) == 1, f"Expected one matching DLL; found {selected}"
              target.write_bytes(z.read(selected[0]))
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          expected = "35f2c69afd86fc2a986bde045b9843bb959af011ede8f9cac03de8cb498e816b"
          print("Downloaded Thunderstore DLL SHA256:", actual)
          print("User-provided DLL SHA256:       ", expected)
          pathlib.Path("recovered/SOURCE_PROVENANCE.txt").write_text(
              "Thunderstore: Balrond-balrond_furRandomizer-1.0.7\n"
              "Download: https://gcdn.thunderstore.io/live/repository/packages/Balrond-balrond_furRandomizer-1.0.7.zip\n"
              "Original user DLL SHA256: " + expected + "\n"
              "Downloaded DLL SHA256:   " + actual + "\n"
              "Identical binaries: " + str(actual == expected) + "\n",
              encoding="utf-8")
          PY

      - name: Decompile managed code into a C# project
        shell: bash
        run: |
          ilspycmd --version
          ilspycmd -p -o recovered/source _input/BalrondFurRandomizer.dll
          find recovered/source -maxdepth 3 -type f | head -45

      - name: Install Unity extraction dependencies
        run: |
          python3 -m pip install --disable-pip-version-check UnityPy Pillow

      - name: Recover embedded AssetBundle, textures and materials
        run: |
          python3 scripts/recover_assets.py _input/BalrondFurRandomizer.dll recovered/assets

      - name: Build animal/variant/material-to-texture catalogue
        run: python3 scripts/build_material_catalog.py recovered/assets

      - name: Write recovery report
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("recovered")
          data=json.loads((root/"assets/MANIFEST.json").read_text())
          cs=sorted(str(p.relative_to(root)) for p in (root/"source").rglob("*.cs"))
          text=[
            "# Recovery report",
            "",
            "Automated decompilation of Balrond Fur Randomizer 1.0.7.",
            "",
            "## Results",
            "",
            "- Decompiled C# files: " + str(len(cs)),
            "- Decoded PNG textures: " + str(data["texture_count"]),
            "- Exported material and other Unity object property trees: " + str(data["material_count"]),
            "- Unity object types: " + repr(data["object_counts"]),
            "- Extraction warnings/errors: " + str(len(data["errors"])),
            "",
            "## Limitations",
            "",
            "- Decompiled code is not the author's original source and may require editing.",
            "- The original Unity project and its import pipeline are not reconstructed.",
            "- JSON material trees are diagnostics/recipes, not ready-to-import .mat files.",
            "- Game-specific assembly references are not bundled here; a Valheim 1.0 build has not been tested.",
            "- This public repository may require the original author's redistribution permission.",
            "",
            "See assets/MANIFEST.json and SOURCE_PROVENANCE.txt for verification.",
            "",
          ]
          (root/"RECOVERY_REPORT.md").write_text("\n".join(text),encoding="utf-8")
          PY

      - name: Upload recovered project as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirroh-fur-recovered
          path: recovered/
          if-no-files-found: error
          retention-days: 30

      - name: Commit reconstructed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered/
          if git diff --cached --quiet; then
            echo "No changes to recovered files."
          else
            git commit -m "feat: restore decompiled C# and Unity textures from Balrond 1.0.7"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
